<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NyaySetu – Bridge to Justice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#12202E; --muted:#52606D; --line:#D3DCE3;
  --primary:#164E7A; --on-primary:#FFFFFF; --accent:#D97F0B; --danger:#C0272D; --on-danger:#fff;
  --tint:#E6EEF4; --focus:#D97F0B; --bw:1px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1721; --surface:#152431; --ink:#E8EEF3; --muted:#9FB0BF; --line:#2B3E4E;
    --primary:#7DBBEB; --on-primary:#08141E; --accent:#F2A640; --danger:#E5484D; --tint:#1B2E3D; --focus:#F2A640;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1721; --surface:#152431; --ink:#E8EEF3; --muted:#9FB0BF; --line:#2B3E4E;
  --primary:#7DBBEB; --on-primary:#08141E; --accent:#F2A640; --danger:#E5484D; --tint:#1B2E3D; --focus:#F2A640;
}
:root[data-contrast="high"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#1A1A1A; --line:#000000;
  --primary:#00325C; --on-primary:#FFFFFF; --accent:#8A4B00; --danger:#9B0000; --tint:#EDEDED; --focus:#0000EE; --bw:2px;
}
@media (prefers-color-scheme: dark){
  :root[data-contrast="high"]:not([data-theme="light"]){
    --bg:#000; --surface:#000; --ink:#FFFFFF; --muted:#EDEDED; --line:#FFFFFF;
    --primary:#FFE14D; --on-primary:#000; --accent:#FFB347; --danger:#FF7B7B; --tint:#111; --focus:#4DD2FF; --bw:2px;
  }
}
:root[data-contrast="high"][data-theme="dark"]{
  --bg:#000; --surface:#000; --ink:#FFFFFF; --muted:#EDEDED; --line:#FFFFFF;
  --primary:#FFE14D; --on-primary:#000; --accent:#FFB347; --danger:#FF7B7B; --tint:#111; --focus:#4DD2FF; --bw:2px;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.55;padding-bottom:84px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px}
.brand{display:flex;flex-direction:column;line-height:1.1;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--primary)}
.brand small{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:6px}
.ctl button{min-width:44px;height:40px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
.ctl button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* hero */
.hero{padding:30px 0 22px;position:relative}
.hero h1{font-size:clamp(32px,8.5vw,52px);line-height:1.05;margin:0 0 12px;font-weight:800;letter-spacing:-.02em;max-width:14em}
.hero p.lede{margin:0 0 18px;color:var(--muted);max-width:34em}
.bridge{display:block;width:100%;height:auto;margin:6px 0 0;color:var(--primary)}
.ask{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;padding:12px}
.ask label{display:block;font-weight:700;margin-bottom:6px}
.ask textarea{width:100%;min-height:76px;resize:vertical;border:var(--bw) solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:8px;border:var(--bw) solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.chip{border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:15px;cursor:pointer}
.stats{display:flex;gap:22px;margin:20px 0 0;color:var(--muted);font-size:15px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}

h2{font-size:24px;line-height:1.2;margin:30px 0 10px;font-weight:800;letter-spacing:-.01em}
h3{font-size:18px;margin:22px 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 12px}

/* index list */
.index{list-style:none;margin:0;padding:0;border-top:var(--bw) solid var(--line)}
.index li{border-bottom:var(--bw) solid var(--line)}
.index button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;padding:14px 2px;cursor:pointer}
.index .t{font-weight:700;font-size:18px;display:block}
.index .d{color:var(--muted);font-size:15px;display:block}
.index .go{font-size:22px;color:var(--primary);flex:none}
.match{border-left:6px solid var(--accent);padding-left:12px;margin:0 0 6px}

/* detail */
.back{background:none;border:0;color:var(--primary);font-weight:700;padding:14px 0 0;cursor:pointer;font-size:16px}
.detail h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:8px 0 6px;font-weight:800;letter-spacing:-.015em}
.law{background:var(--tint);border-radius:8px;padding:10px 12px;font-size:15px}
.block ul,.block ol{margin:0;padding-left:22px}
.block li{margin:0 0 8px}
.helps{display:flex;flex-wrap:wrap;gap:8px}
.helps a{display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.helps a b{color:var(--primary);font-size:19px}
.helps a span{font-size:14px;color:var(--muted)}

/* emergency */
.sos{border:var(--bw) solid var(--line);border-left:8px solid var(--danger);background:var(--surface);border-radius:10px;padding:16px;margin:16px 0}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:600px){.hl{grid-template-columns:repeat(3,1fr)}}
.hl a{display:block;border:var(--bw) solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.hl a b{display:block;font-size:26px;line-height:1.1;color:var(--primary);font-weight:800}
.hl a span{font-size:14px;color:var(--muted);display:block;line-height:1.3}
.hl a.main{grid-column:1/-1;background:var(--danger);border-color:var(--danger)}
.hl a.main b,.hl a.main span{color:var(--on-danger)}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-weight:600;margin-bottom:4px;font-size:15px}
.field input,.field textarea,.field select{width:100%;border:var(--bw) solid var(--line);border-radius:8px;background:var(--surface);padding:9px 10px;min-height:44px}
.field textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.check input{width:22px;height:22px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.contact{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:var(--bw) solid var(--line);padding:8px 0;flex-wrap:wrap}
.status{margin:10px 0 0;color:var(--muted);font-size:15px}
.msgbox{background:var(--bg);border:var(--bw) dashed var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:15px;margin-top:10px}

/* documents */
.seg{display:flex;border:var(--bw) solid var(--primary);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.seg button{flex:1;min-height:44px;background:transparent;border:0;font-weight:700;color:var(--primary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.doc-paper{background:#fff;color:#000;border:1px solid #bbb;border-radius:4px;padding:22px 20px;font-family:"Noto Serif Devanagari","Noto Serif",Georgia,"Times New Roman",serif;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.note{font-size:14px;color:var(--muted)}

/* courts */
.ladder{list-style:none;padding:0;margin:0;border-left:4px solid var(--primary)}
.ladder li{padding:0 0 12px 14px;position:relative}
.ladder li b{display:block}
.links a{display:block;padding:10px 0;border-bottom:var(--bw) solid var(--line);text-decoration:none;font-weight:600}
.links a span{display:block;font-weight:400;color:var(--muted);font-size:14px}
.search{width:100%;border:var(--bw) solid var(--line);border-radius:8px;background:var(--surface);padding:10px;min-height:44px;margin-bottom:6px}

footer.foot{margin-top:40px;padding:18px 0 10px;border-top:var(--bw) solid var(--line);color:var(--muted);font-size:14px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;min-height:56px;padding:6px 2px;font-size:13px;line-height:1.15;font-weight:600;color:var(--muted);cursor:pointer;border-top:4px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--primary);border-top-color:var(--primary)}
nav.tabs button.sosb{color:var(--danger)}
nav.tabs button.sosb[aria-current="page"]{border-top-color:var(--danger);color:var(--danger)}

@media (prefers-reduced-motion:no-preference){
  .bridge path.arc{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s ease-out .2s forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}

@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .doc-paper{border:0;padding:0;font-size:12pt}
  :root{padding:0}
}
</style>
</head>

  docs:["Transaction details / bank statement","Screenshots and chat history","ID proof and phone number of the fraudster"]},
 hi:{title:"साइबर ठगी या ऑनलाइन धोखाधड़ी",desc:"पैसे कट गए, अकाउंट हैक हुआ, या ऑनलाइन ठगी हुई।",
  rights:["आप ऑनलाइन ठगी की शिकायत कभी भी कर सकते हैं, पर शुरुआती कुछ घंटे सबसे ज़रूरी हैं; बैंक पैसे जल्दी रोक सकता है।","शिकायत थाने गए बिना ऑनलाइन दर्ज की जा सकती है।","बिना अनुमति वाले लेन-देन की सूचना पर बैंक को कार्रवाई करनी होती है, और जल्दी बताने से आपकी ज़िम्मेदारी सीमित रहती है (आरबीआई नियम)।"],
  law:"आईटी अधिनियम, 2000 (धारा 66C, 66D); बीएनएस 2023 धारा 318 (धोखाधड़ी)।",
  steps:["तुरंत 1930 पर कॉल करें। रकम, तारीख, ट्रांज़ैक्शन आईडी (UTR) और खाते की जानकारी दें।","cybercrime.gov.in पर शिकायत करें और पावती (acknowledgement) नंबर नोट करें।","बैंक को कॉल करके कार्ड, UPI या खाता ब्लॉक कराएँ और लिखित शिकायत नंबर लें।","स्क्रीनशॉट, नंबर, लिंक और चैट सुरक्षित रखें। OTP या PIN किसी को न बताएँ।","प्रभावित खातों के पासवर्ड बदलें। पुलिस माँगे तो एफआईआर दर्ज कराएँ।"],
  docs:["लेन-देन का विवरण / बैंक स्टेटमेंट","स्क्रीनशॉट और चैट","ठग का फोन नंबर / खाता विवरण"]}},

{id:"consumer",doc:"notice",help:["1915"],kw:["consumer","product","refund","defective","warranty","replacement","shop","seller","service","amazon","flipkart","order","bill","उपभोक्ता","रिफंड","खराब","सामान","दुकान","वारंटी"],
 en:{title:"Consumer dispute",desc:"Defective product, bad service, overcharging or no refund.",
  rights:["You can claim refund, replacement, repair or compensation for defective goods, deficient service or unfair trade practice.","You can file online (e-Daakhil) from home. A lawyer is not compulsory.","No court fee for claims up to ₹5 lakh.","File within 2 years of the problem arising."],
  law:"Consumer Protection Act, 2019.",
  steps:["Keep the bill, warranty, payment proof, photos and chats with the seller.","Complain to the seller or company in writing, and register at the National Consumer Helpline (1915 or consumerhelpline.gov.in).","Send a legal notice giving 15–30 days to fix it. Use the Legal Notice generator.","File at the District Consumer Commission through e-Daakhil. District: up to ₹50 lakh; State: ₹50 lakh–₹2 crore; National: above ₹2 crore."],
  docs:["Bill / invoice and warranty card","Payment proof","Photos, emails and chats"]},
 hi:{title:"उपभोक्ता विवाद",desc:"खराब सामान, खराब सेवा, ज़्यादा वसूली या रिफंड न मिलना।",
  rights:["खराब सामान, कमी वाली सेवा या अनुचित व्यापार व्यवहार पर आप रिफंड, बदली, मरम्मत या मुआवज़ा माँग सकते हैं।","आप घर से ऑनलाइन (ई-दाखिल) शिकायत कर सकते हैं। वकील ज़रूरी नहीं है।","₹5 लाख तक के दावों पर कोर्ट फीस नहीं लगती।","समस्या होने के 2 साल के भीतर शिकायत करें।"],
  law:"उपभोक्ता संरक्षण अधिनियम, 2019।",
  steps:["बिल, वारंटी, भुगतान का सबूत, फोटो और विक्रेता से चैट सुरक्षित रखें।","विक्रेता या कंपनी को लिखित शिकायत दें और राष्ट्रीय उपभोक्ता हेल्पलाइन (1915 या consumerhelpline.gov.in) पर दर्ज करें।","15–30 दिन की समय-सीमा देते हुए कानूनी नोटिस भेजें। इसके लिए कानूनी नोटिस जनरेटर इस्तेमाल करें।","ई-दाखिल से ज़िला उपभोक्ता आयोग में शिकायत करें। ज़िला: ₹50 लाख तक; राज्य: ₹50 लाख–₹2 करोड़; राष्ट्रीय: ₹2 करोड़ से ऊपर।"],
  docs:["बिल / इनवॉइस और वारंटी कार्ड","भुगतान का सबूत","फोटो, ईमेल और चैट"]}},

{id:"dv",help:["181","112","100"],kw:["domestic","husband","wife","dowry","beat","abuse","violence","in-laws","marriage","घरेलू","पति","दहेज","मारपीट","हिंसा","ससुराल","प्रताड़ना"],
 en:{title:"Domestic violence",desc:"Abuse or cruelty at home by a partner or relatives.",
  rights:["Domestic violence includes physical, emotional, sexual, verbal and economic abuse, not only beating.","You can ask for a protection order, the right to stay in the shared home, monetary relief and child custody.","You can seek help even if you are in a live-in relationship.","Free legal aid and shelter are available to women."],
  law:"Protection of Women from Domestic Violence Act, 2005; BNS 2023 S.85–86 (cruelty by husband or relatives).",
  steps:["If you are in danger, call 112 or the Women Helpline 181 now.","Contact the Protection Officer or the nearest One Stop Centre (Sakhi) for shelter, medical care and filing help.","Get a medical examination and keep the report. Save photos, messages and a record of each incident.","Apply to the Magistrate for protection, residence or monetary relief. The DLSA gives free legal aid."],
  docs:["Medical report","Photos / messages / call records","ID proof and marriage or relationship proof"]},
 hi:{title:"घरेलू हिंसा",desc:"घर में पति/साथी या रिश्तेदारों द्वारा मारपीट या क्रूरता।",
  rights:["घरेलू हिंसा में शारीरिक, भावनात्मक, यौन, मौखिक और आर्थिक शोषण शामिल है, सिर्फ़ मारपीट नहीं।","आप सुरक्षा आदेश, साझा घर में रहने का अधिकार, आर्थिक सहायता और बच्चों की अभिरक्षा माँग सकती हैं।","लिव-इन संबंध में भी आप मदद माँग सकती हैं।","महिलाओं को निःशुल्क कानूनी सहायता और आश्रय मिलता है।"],
  law:"घरेलू हिंसा से महिलाओं का संरक्षण अधिनियम, 2005; बीएनएस 2023 धारा 85–86 (पति या रिश्तेदारों की क्रूरता)।",
  steps:["खतरे में हों तो अभी 112 या महिला हेल्पलाइन 181 पर कॉल करें।","आश्रय, इलाज और शिकायत में मदद के लिए संरक्षण अधिकारी या नज़दीकी वन स्टॉप सेंटर (सखी) से मिलें।","मेडिकल जाँच कराएँ और रिपोर्ट रखें। फोटो, संदेश और हर घटना का रिकॉर्ड सुरक्षित रखें।","मजिस्ट्रेट को सुरक्षा, निवास या आर्थिक राहत का आवेदन दें। DLSA निःशुल्क कानूनी सहायता देता है।"],
  docs:["मेडिकल रिपोर्ट","फोटो / संदेश / कॉल रिकॉर्ड","पहचान पत्र और विवाह या संबंध का प्रमाण"]}},

{id:"tenant",doc:"notice",help:["15100","100"],kw:["rent","tenant","landlord","evict","eviction","deposit","lease","house owner","मकान मालिक","किराया","किरायेदार","जमा राशि","खाली"],
 en:{title:"Rent and landlord problems",desc:"Eviction, deposit not returned, or unfair rent demands.",
  rights:["A landlord cannot throw you out, lock you out or cut water and electricity without legal process.","You can ask for a written rent agreement and receipts for rent and deposit.","The security deposit must be returned after you vacate, after lawful deductions.","Rules differ by state. Check your state’s Rent Control Act or Model Tenancy law."],
  law:"State Rent Control Acts; Transfer of Property Act, 1882 (S.106); Model Tenancy Act, 2021 where adopted.",
  steps:["Keep the rent agreement, receipts and bank transfers. Take dated photos of the property condition.","Reply to any eviction or demand in writing. Do not sign blank papers.","Send a legal notice for refund of the deposit with a deadline. Use the generator.","If it continues, approach the Rent Authority or civil court, or the DLSA for free advice."],
  docs:["Rent agreement","Rent receipts / bank transfers","Photos of the property at move-in and move-out"]},
 hi:{title:"किराया और मकान मालिक की समस्या",desc:"बेदखली, जमा राशि न लौटाना या अनुचित किराया माँग।",
  rights:["मकान मालिक कानूनी प्रक्रिया के बिना आपको निकाल नहीं सकता, ताला नहीं लगा सकता, या पानी-बिजली नहीं काट सकता।","आप लिखित किराया समझौता और किराए व जमा राशि की रसीद माँग सकते हैं।","मकान खाली करने पर वैध कटौती के बाद सिक्योरिटी डिपॉज़िट लौटाना होता है।","नियम राज्य के अनुसार अलग हैं। अपने राज्य का किराया नियंत्रण कानून या मॉडल टेनेंसी कानून देखें।"],
  law:"राज्य किराया नियंत्रण अधिनियम; संपत्ति अंतरण अधिनियम, 1882 (धारा 106); मॉडल टेनेंसी अधिनियम, 2021 (जहाँ लागू)।",
  steps:["किराया समझौता, रसीदें और बैंक ट्रांसफर रखें। संपत्ति की स्थिति की तारीख वाली फोटो लें।","बेदखली या किसी माँग का जवाब लिखित में दें। कोरे कागज़ पर हस्ताक्षर न करें।","जमा राशि लौटाने के लिए समय-सीमा के साथ कानूनी नोटिस भेजें। जनरेटर इस्तेमाल करें।","समस्या बनी रहे तो किराया प्राधिकरण या सिविल कोर्ट जाएँ, या निःशुल्क सलाह के लिए DLSA से मिलें।"],
  docs:["किराया समझौता","किराया रसीदें / बैंक ट्रांसफर","मकान में आने और जाने के समय की फोटो"]}},

{id:"arrest",help:["112","15100","100"],kw:["arrest","arrested","custody","bail","detain","lockup","jail","गिरफ्तार","हिरासत","जमानत","ज़मानत","लॉकअप"],
 en:{title:"Arrest and bail rights",desc:"You or someone you know has been arrested or detained.",
  rights:["You must be told the reason for the arrest, and your family or a friend must be informed.","You must be produced before a Magistrate within 24 hours, excluding travel time.","You have the right to meet a lawyer, and free legal aid if you cannot afford one.","You cannot be tortured or made to sign blank papers. In bailable offences, bail is a right.","A woman should not be arrested after sunset and before sunrise, except with a Magistrate’s written permission."],
  law:"Constitution Art. 20–22, 39A; BNSS 2023 (S.47, 48, 58, 478); D.K. Basu v. State of W.B. (1997).",
  steps:["Stay calm and do not resist. Ask the officer’s name and the reason for arrest.","Ask the police to inform a family member or friend. Share a lawyer’s or DLSA number.","Ask for a lawyer. If you cannot afford one, tell the Magistrate you want free legal aid.","Tell the Magistrate about any injury or ill-treatment and ask for a medical examination."],
  docs:["Copy of arrest memo","ID proof","Lawyer’s or DLSA contact"]},
 hi:{title:"गिरफ्तारी और ज़मानत के अधिकार",desc:"आप या आपके किसी जानने वाले को गिरफ्तार या हिरासत में लिया गया है।",
  rights:["गिरफ्तारी का कारण बताया जाना चाहिए और आपके परिवार या मित्र को सूचित किया जाना चाहिए।","यात्रा का समय छोड़कर 24 घंटे के भीतर आपको मजिस्ट्रेट के सामने पेश करना होगा।","आपको वकील से मिलने का अधिकार है, और खर्च न उठा सकें तो निःशुल्क कानूनी सहायता मिलती है।","आपको यातना नहीं दी जा सकती और कोरे कागज़ पर हस्ताक्षर नहीं कराए जा सकते। जमानती अपराध में ज़मानत अधिकार है।","महिला को सूर्यास्त के बाद और सूर्योदय से पहले गिरफ्तार नहीं किया जाना चाहिए, सिवाय मजिस्ट्रेट की लिखित अनुमति के।"],
  law:"संविधान अनुच्छेद 20–22, 39A; बीएनएसएस 2023 (धारा 47, 48, 58, 478); डी.के. बसु बनाम पश्चिम बंगाल (1997)।",
  steps:["शांत रहें और विरोध न करें। अधिकारी का नाम और गिरफ्तारी का कारण पूछें।","पुलिस से परिवार या मित्र को सूचना देने को कहें। वकील या DLSA का नंबर दें।","वकील माँगें। खर्च न उठा सकें तो मजिस्ट्रेट से निःशुल्क कानूनी सहायता माँगें।","चोट या बुरे बर्ताव के बारे में मजिस्ट्रेट को बताएँ और मेडिकल जाँच माँगें।"],
  docs:["गिरफ्तारी मेमो की प्रति","पहचान पत्र","वकील या DLSA का संपर्क"]}},

{id:"posh",help:["181","112"],kw:["harass","harassment","workplace","office","molest","sexual","posh","छेड़छाड़","उत्पीड़न","दफ्तर","ऑफिस","यौन"],
 en:{title:"Sexual harassment at work",desc:"Unwelcome behaviour, advances or threats at your workplace.",
  rights:["Every workplace with 10 or more employees must have an Internal Committee (IC) for such complaints.","You can complain within 3 months of the incident (extendable by up to 3 more months).","Your identity and the complaint must be kept confidential, and you cannot be punished for complaining.","If the workplace is small, complain to the district Local Committee."],
  law:"Sexual Harassment of Women at Workplace (POSH) Act, 2013; BNS 2023 S.75.",
  steps:["Write down what happened: dates, places, witnesses, messages or emails.","Submit a written complaint to the Internal Committee (or Local Committee) and ask for an acknowledgement.","You can also use the SHe-Box portal of the Ministry of Women and Child Development.","If you feel unsafe, call 181 or 112. You may also file a police complaint."],
  docs:["Written complaint","Messages, emails, call records","Names of witnesses"]},
 hi:{title:"कार्यस्थल पर यौन उत्पीड़न",desc:"काम की जगह पर अनचाहा व्यवहार, प्रस्ताव या धमकी।",
  rights:["10 या अधिक कर्मचारियों वाले हर कार्यस्थल में ऐसी शिकायतों के लिए आंतरिक समिति (IC) होनी चाहिए।","घटना के 3 महीने के भीतर शिकायत करें (अधिकतम 3 महीने और बढ़ सकते हैं)।","आपकी पहचान और शिकायत गोपनीय रहनी चाहिए, और शिकायत के लिए आपको सज़ा नहीं दी जा सकती।","छोटे कार्यस्थल में ज़िले की स्थानीय समिति में शिकायत करें।"],
  law:"कार्यस्थल पर महिलाओं का यौन उत्पीड़न (POSH) अधिनियम, 2013; बीएनएस 2023 धारा 75।",
  steps:["क्या हुआ लिख लें: तारीख, जगह, गवाह, संदेश या ईमेल।","आंतरिक समिति (या स्थानीय समिति) को लिखित शिकायत दें और पावती माँगें।","आप महिला एवं बाल विकास मंत्रालय के SHe-Box पोर्टल का भी उपयोग कर सकती हैं।","असुरक्षित लगे तो 181 या 112 पर कॉल करें। आप पुलिस में भी शिकायत कर सकती हैं।"],
  docs:["लिखित शिकायत","संदेश, ईमेल, कॉल रिकॉर्ड","गवाहों के नाम"]}},

{id:"accident",help:["112","108","100"],kw:["accident","crash","hit","vehicle","injured","road","insurance","car","bike","truck","दुर्घटना","एक्सीडेंट","टक्कर","घायल","बीमा","गाड़ी"],
 en:{title:"Road accident",desc:"You or someone else was hurt in a road accident.",
  rights:["A bystander who helps an injured person (a Good Samaritan) is protected and need not give personal details.","Hospitals must give emergency first aid without waiting for payment or police formalities.","Victims or families can claim compensation from the Motor Accident Claims Tribunal. Hit-and-run victims have a government compensation scheme."],
  law:"Motor Vehicles Act, 1988 (S.134A, 166); BNS 2023 S.106, 281.",
  steps:["Call 112 or 108 and get the injured person to hospital quickly.","Note the vehicle number, take photos and collect witness details.","File an FIR at the nearest police station and keep a copy.","Inform the insurer and file a claim with the Motor Accident Claims Tribunal. A lawyer or DLSA can help."],
  docs:["FIR copy","Medical bills and reports","Vehicle, licence and insurance details"]},
 hi:{title:"सड़क दुर्घटना",desc:"आप या कोई और सड़क दुर्घटना में घायल हुआ है।",
  rights:["घायल की मदद करने वाले राहगीर (गुड सेमेरिटन) को सुरक्षा मिलती है और उसे निजी जानकारी देना ज़रूरी नहीं।","अस्पताल को भुगतान या पुलिस कार्रवाई का इंतज़ार किए बिना आपातकालीन प्राथमिक उपचार देना होता है।","पीड़ित या परिवार मोटर दुर्घटना दावा अधिकरण से मुआवज़ा माँग सकते हैं। हिट-एंड-रन पीड़ितों के लिए सरकारी मुआवज़ा योजना है।"],
  law:"मोटर वाहन अधिनियम, 1988 (धारा 134A, 166); बीएनएस 2023 धारा 106, 281।",

function applyPrefs(){
  const r=document.documentElement;
  if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);
  if(S.hc)r.setAttribute("data-contrast","high");else r.removeAttribute("data-contrast");
  r.lang=S.lang==="hi"?"hi":"en";

  $("#b-lang").setAttribute("aria-label",S.lang==="en"?"हिंदी में बदलें":"Switch to English");
  $("#b-hc").setAttribute("aria-pressed",String(S.hc));
  $("#b-hc").setAttribute("aria-label",S.lang==="hi"?"उच्च कंट्रास्ट":"High contrast");
  const dark=effectiveDark();
  $("#b-theme").setAttribute("aria-pressed",String(dark));
  $("#b-theme").setAttribute("aria-label",S.lang==="hi"?"डार्क मोड":"Dark mode");
  $("#tag").textContent=u("tag");

function effectiveDark(){
  if(S.theme==="dark")return true; if(S.theme==="light")return false;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
}

/* ---------- search (rule-based keyword match) ---------- */
function search(q){
  const s=q.toLowerCase();
  const scored=CATS.map(c=>({c,n:c.kw.reduce((a,k)=>a+(s.includes(k.toLowerCase())?1:0),0)})).filter(x=>x.n>0);
  scored.sort((a,b)=>b.n-a.n);
  return scored.slice(0,3).map(x=>x.c);
}

  <p style="margin:0">Dhiraj Kumar (0808IO241020)<br>Gaurav Vyas (0808IO241023)<br>Aavesh Patel (0808IO241002)</p>
  <p class="note">${en?"Guided by Vijay Mandle":"मार्गदर्शक: विजय मंडले"}</p>
  <footer class="foot">${u("disc")}<br>${u("proj")}</footer>`;
}

/* ---------- render ---------- */
const TABS=["rights","sos","docs","aid","about"];
function render(){
  applyPrefs();
  $("#tabs").innerHTML=TABS.map((t,i)=>`<button data-act="tab" data-t="${t}" class="${t==="sos"?"sosb":""}" ${S.tab===t?'aria-current="page"':""}>${U[L()].tabs[i]}</button>`).join("");
  const m=$("#main");
  m.innerHTML=({rights:vRights,sos:vEmergency,docs:vDocs,aid:vCourts,about:vAbout})[S.tab]();
  if(S.tab==="docs")updatePaper();
}
function updatePaper(){const p=$("#paper");if(p)p.textContent=buildDoc()}
function go(tab){S.tab=tab;S.cat=null;render();window.scrollTo(0,0)}

/* ---------- SOS ---------- */
function buildSos(lat,lng){
  S.sos.msg = lat==null ? u("sosNoLoc")+u("sosSig")
    : u("sosMsg")+`https://maps.google.com/?q=${lat},${lng}`+u("sosSig");
  S.sos.ready=true;
}
function startSos(){
  S.sos.status=u("sosLoc");S.sos.ready=false;render();
  const fail=()=>{buildSos(null);S.sos.status=u("sosFail");render()};
  try{
    if(!navigator.geolocation)return fail();
    navigator.geolocation.getCurrentPosition(
      p=>{buildSos(p.coords.latitude.toFixed(6),p.coords.longitude.toFixed(6));S.sos.status=u("sosOk");render()},
      fail,{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  }catch(e){fail()}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e){return false}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="home"){S.results=null;go("rights")}
  else if(a==="tab")go(el.dataset.t);
  else if(a==="lang"){S.lang=S.lang==="en"?"hi":"en";S.docLang=null;store.set("ns_lang",S.lang);render()}
  else if(a==="theme"){S.theme=effectiveDark()?"light":"dark";store.set("ns_theme",S.theme);render()}
  else if(a==="contrast"){S.hc=!S.hc;store.set("ns_hc",S.hc);render()}
  else if(a==="cat"){S.cat=el.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="uncat"){S.cat=null;render();window.scrollTo(0,0)}
  else if(a==="find"){const q=$("#q");S.q=q?q.value:"";S.results=S.q.trim()?search(S.q):null;render();const r=document.querySelector(".match, .sub[style]");if(r)r.scrollIntoView({block:"center"})}
  else if(a==="eg"){S.q=U[L()].eg[+el.dataset.i];S.results=search(S.q);render()}
  else if(a==="mknotice"){const c=CATS.find(x=>x.id===el.dataset.id);S.docType="notice";if(!(S.f.notice.subject||"").trim())S.f.notice.subject=c[dl()].title;S.tab="docs";S.cat=null;render();window.scrollTo(0,0)}
  else if(a==="dtype"){S.docType=el.dataset.t;render()}
  else if(a==="print"){try{window.print()}catch(x){$("#docMsg").textContent=u("printFail")}}
  else if(a==="copydoc"){const ok=await copyText(buildDoc());$("#docMsg").textContent=ok?u("copied"):u("printFail")}
  else if(a==="sos")startSos();
  else if(a==="copySos"){const ok=await copyText(S.sos.msg);el.textContent=ok?u("copied"):u("copy")}
  else if(a==="shareSos"){try{await navigator.share({text:S.sos.msg})}catch(x){}}
  else if(a==="addc"){
    const n=($("#cn").value||"").trim(),p=($("#cp").value||"").trim();
    if(n&&p.replace(/\D/g,"").length>=8&&S.contacts.length<5){S.contacts.push({name:n,phone:p});store.set("ns_contacts",S.contacts);render()}
  }
  else if(a==="delc"){S.contacts.splice(+el.dataset.i,1);store.set("ns_contacts",S.contacts);render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){S.f[S.docType][t.dataset.f]=t.type==="checkbox"?t.checked:t.value;updatePaper()}
  else if(t.id==="lf"){const s=t.value.toLowerCase().trim();document.querySelectorAll("#links a").forEach(a=>{a.style.display=a.dataset.s.includes(s)?"":"none"})}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f&&t.type==="checkbox"){S.f[S.docType][t.dataset.f]=t.checked;updatePaper()}
  if(t.id==="dlang"){S.docLang=t.value;render()}
});
render();
</script>
</body>
